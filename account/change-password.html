<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password · AttendTa</title><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css"><link rel="stylesheet" href="../assets/account.css">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tailwind.config.js"></script><script src="../assets/app.js" defer></script>
  <script src="../assets/account-tools.js" defer></script>
</head><body class="min-h-[100dvh] bg-canvas-ground font-sans text-ink antialiased flex flex-col">
<a class="skip-link" href="#main">Skip to content</a>
<header class="border-b border-slate-200 bg-white"><div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3">
<a href="../index.html" class="flex items-center gap-2 font-extrabold"><img src="../assets/attendTa_logo.jpg" width="32" height="32" alt="AttendTa logo" class="rounded object-contain">AttendTa</a>
<a href="../student/events.html" data-account-back class="btn btn--ghost btn--sm ml-auto">Back to workspace</a></div></header>
<main id="main" class="w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1">
<div class="mb-8"><p class="text-sm text-ink-muted mb-2">Account settings</p><h1 class="font-gate text-2xl font-bold tracking-tight">Change password</h1><p class="mt-2 text-ink-secondary">Choose a password you do not use for other accounts.</p></div>
<div class="account-layout"><nav class="account-nav" aria-label="Account settings"><a href="profile.html">My profile</a><a href="change-password.html" aria-current="page">Change password</a></nav>
<div class="account-content"><div class="mb-6"><div class="font-semibold" data-account-name></div><div class="text-sm text-ink-muted break-words" data-account-email></div></div>
<div class="card-hairline p-4 mb-5" data-account-notice role="status" hidden></div>
<form method="post" action="change-password.html" data-action="account.change-password" data-account-form="password" novalidate>
<fieldset class="account-section space-y-5"><div class="field"><label class="field-label field-required" for="CurrentPassword">Current password</label><input class="input" id="CurrentPassword" name="CurrentPassword" type="password" required autocomplete="current-password"><div class="field-error"></div></div><div class="field"><label class="field-label field-required" for="NewPassword">New password</label><input class="input" id="NewPassword" name="NewPassword" type="password" required autocomplete="new-password" minlength="8" aria-describedby="password-help"><div class="field-error"></div></div><p id="password-help" class="field-help">Use at least 8 characters. This minimum is a prototype policy.</p><div class="field"><label class="field-label field-required" for="ConfirmPassword">Confirm new password</label><input class="input" id="ConfirmPassword" name="ConfirmPassword" type="password" required autocomplete="new-password" data-match="NewPassword"><div class="field-error"></div></div><label class="flex items-center gap-2 text-sm"><input type="checkbox" class="checkbox" aria-label="Show passwords" data-show-account-passwords>Show passwords</label><div class="account-actions"><button class="btn btn--ghost" type="reset">Clear</button><button class="btn btn--primary" type="submit">Change password</button></div></fieldset><p class="field-error mt-4" data-account-error role="alert" tabindex="-1"></p></form>
</div></div></main><footer class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 text-xs text-ink-muted">AttendTa account settings</footer></body></html>
